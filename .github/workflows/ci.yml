name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan full Git history for secrets
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts=--all --redact=100 --no-banner

  docs-and-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check integration examples and contracts
        run: |
          for tool in bash curl jq timeout; do command -v "$tool"; done
          node scripts/check-integrations.mjs
          node scripts/license-inventory.mjs --check
          node scripts/check-public-content.mjs --self-test
          node scripts/check-public-content.mjs
          node scripts/check-repository-privacy.mjs --self-test
          node scripts/check-repository-privacy.mjs
      - name: Check registry inventory and cleanup recovery
        run: node --test deploy/registry/*.test.mjs
      - name: Check deployment script syntax
        run: |
          bash -n deploy/firewall/rdf-egress-firewall.sh
          node --check scripts/init-local.mjs
          bash -n scripts/backup-farm.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check real-node verification harness
        run: python -m unittest discover -s deploy/emulator -p test_verification.py
      - name: Check emulator image layout and ADB authentication gate
        run: |
          for tool in bash timeout dd od tr; do command -v "$tool"; done
          bash -n agent/emulator-image/adb-auth-gate.sh
          python -B -m unittest discover -s agent/emulator-image -p 'test_*.py'
      - name: Verify registry uploads through real nginx
        run: |
          docker build --build-context web_config=frontend -f scripts/test/registry-proxy.Dockerfile --tag rdf-registry-proxy-ci scripts/test
          docker run --rm --network none --read-only --cap-drop ALL --pids-limit 64 --memory 192m --tmpfs /tmp:rw,nosuid,nodev,size=32m rdf-registry-proxy-ci
      - name: Validate generated single-host Compose configuration
        run: |
          node scripts/init-local.mjs
          docker compose -f compose.yaml -f compose.agent.yaml -f compose.override.yaml config --quiet
      - name: Validate OpenAPI specification
        run: npx --yes @apidevtools/swagger-cli@4.0.4 validate docs/api/openapi.yaml

  appium-dependencies:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/appium
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: examples/appium/package-lock.json
      - run: npm ci
      - name: Verify Appium and pinned driver can load
        run: |
          node node_modules/appium/index.js --version
          node node_modules/appium/index.js driver list --installed --json
          node --input-type=module -e "const { AndroidUiautomator2Driver } = await import('appium-uiautomator2-driver'); if (typeof AndroidUiautomator2Driver !== 'function') throw new Error('UiAutomator2 driver did not load')"
          node --input-type=module -e "const { default: sharp } = await import('sharp'); const png = await sharp({ create: { width: 2, height: 2, channels: 3, background: 'red' } }).png().toBuffer(); if (png.readUInt32BE(0) !== 0x89504e47) throw new Error('Sharp PNG encoding failed')"
      - name: Audit pinned Appium dependencies
        run: npm audit --audit-level=high

  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [server, agent, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.component }}/package-lock.json
      - run: npm ci
      - name: Enable stock ADB protocol test
        if: matrix.component == 'server'
        run: |
          sudo apt-get update
          sudo apt-get install -y adb
          echo "RDF_STOCK_ADB=$(command -v adb)" >> "$GITHUB_ENV"
      - name: Install full Chrome with H264 for UI tests
        if: matrix.component == 'frontend'
        run: npx playwright install --with-deps chrome
      - name: Run browser UI tests
        env:
          PLAYWRIGHT_CHANNEL: chrome
        if: matrix.component == 'frontend'
        run: npm run e2e
      - run: npm test
      - run: npm run typecheck
        if: matrix.component == 'frontend'
      - run: npm run build
        if: matrix.component != 'agent'
      - name: Verify server image with restricted source permissions
        if: matrix.component == 'server'
        run: |
          chmod -R go-rwx package.json package-lock.json tsconfig.json src migrations
          docker build --build-context rdf_ui_messages=../shared --build-context rdf_agent_sources=../agent --build-arg AGENT_BUNDLE_VERSION="${GITHUB_SHA::12}" --tag rdf-server-ci .
          docker run --rm --network none --user node --cap-drop ALL --read-only --entrypoint node rdf-server-ci --input-type=module -e "await import('pg'); await import('./dist/http-common.js')"
          docker run --rm --network none --user node --cap-drop ALL --read-only --entrypoint sh rdf-server-ci -ec '
            set -- /app/agent-bundle/*.tar.gz
            test -r "$1"
            test "$(sha256sum "$1" | cut -d" " -f1)" = "$(cat /app/agent-bundle/sha256.txt)"
            listing="$(tar -tzf "$1")"
            printf "%s\n" "$listing" | grep -q "^./compose.agent.yaml$"
            printf "%s\n" "$listing" | grep -q "^./INSTALL.txt$"
            printf "%s\n" "$listing" | grep -q "^./licenses/Apache-2.0.txt$"
            printf "%s\n" "$listing" | grep -q "^./licenses/scrcpy.txt$"
            printf "%s\n" "$listing" | grep -q "^./emulator-image/Dockerfile$"
            printf "%s\n" "$listing" | grep -q "^./emulator-image/rdf-emulator.sh$"
            printf "%s\n" "$listing" | grep -q "^./emulator-image/adb-auth-gate.sh$"
            printf "%s\n" "$listing" | grep -q "^./emulator-image/secure-ramdisk.py$"
            printf "%s\n" "$listing" | grep -q "^./emulator-image/xorg.conf$"
            if printf "%s\n" "$listing" | grep -Eq "(^|/)(\.env[^/]*|adbkey(\.pub)?|[^/]+\.(key|crt|pem))$"; then exit 1; fi
          '
      - name: Verify agent image with restricted source permissions
        if: matrix.component == 'agent'
        run: |
          chmod -R go-rwx package.json package-lock.json src
          docker build --tag rdf-agent-ci .
          docker run --rm --network none --user 10001:10001 --cap-drop ALL --read-only --entrypoint node rdf-agent-ci --input-type=module -e "await import('ws'); await import('./src/config.mjs')"
      - name: Verify web image with restricted source permissions
        if: matrix.component == 'frontend'
        run: |
          chmod -R go-rwx index.html tsconfig.json vite.config.ts nginx.conf src
          docker build --build-context rdf_ui_messages=../shared --tag rdf-web-ci .
          cert_dir="$(mktemp -d "${RUNNER_TEMP}/rdf-cert.XXXXXX")"
          trap 'docker stop rdf-web-ci >/dev/null 2>&1 || true; rm -rf "$cert_dir"' EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=localhost' -keyout "$cert_dir/ip.key" -out "$cert_dir/ip.crt" >/dev/null 2>&1
          docker run -d --rm --name rdf-web-ci --network none --add-host server:127.0.0.1 -v "$cert_dir/ip.crt:/etc/nginx/tls/ip.crt:ro" -v "$cert_dir/ip.key:/etc/nginx/tls/ip.key:ro" rdf-web-ci
          docker exec rdf-web-ci nginx -t
          for attempt in $(seq 1 15); do
            if docker exec rdf-web-ci wget -qO /dev/null http://127.0.0.1/; then break; fi
            sleep 1
          done
          docker exec rdf-web-ci wget -qO /dev/null http://127.0.0.1/
          docker exec rdf-web-ci sh -ec '
            for asset in /usr/share/nginx/html/assets/*.js /usr/share/nginx/html/assets/*.css; do
              test -r "$asset"
              route="${asset#/usr/share/nginx/html}"
              wget -qO /dev/null "http://127.0.0.1$route"
            done
          '

  media-transports:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            agent/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix agent
      - run: npm ci --prefix frontend
      - name: Install full Chrome and media libraries
        working-directory: frontend
        run: npx playwright install --with-deps chrome
      - name: Verify werift is installed
        working-directory: agent
        run: node --input-type=module -e "await import('werift')"
      - name: Verify real H264, DTLS, SRTP and control DataChannel
        timeout-minutes: 2
        run: node scripts/verify-webrtc.mjs
      - name: Verify browser transport and recorded touch pixels
        working-directory: frontend
        run: npx playwright test e2e/session-transport.spec.ts e2e/touch-capture.spec.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: media-transport-traces
          path: frontend/test-results/
          retention-days: 7
