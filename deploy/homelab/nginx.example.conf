# Insert these server blocks inside the existing gateway's http {} block.
# Requires its existing $connection_upgrade map and Docker resolver 127.0.0.11.
# Verify the live certificate paths before use; these match the workstation copy.
server {
    listen 80;
    server_name farm.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name farm.example;

    ssl_certificate     /etc/nginx/certs/farm.example.pem;
    ssl_certificate_key /etc/nginx/certs/farm.example-key.pem;

    client_max_body_size 512m;

    # Farm emulator image registry: image layers are several gigabytes.
    location /v2/ {
        set $farm_upstream http://remote-device-farm-web:80;
        proxy_pass $farm_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 0;
    }

    location / {
        set $farm_upstream http://remote-device-farm-web:80;
        proxy_pass $farm_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
