Section "ServerLayout"
    Identifier "RDFLayout"
    Screen 0 "RDFScreen"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
EndSection

Section "Device"
    Identifier "RDFNvidia"
    Driver "nvidia"
    Option "AllowEmptyInitialConfiguration" "true"
    Option "UseDisplayDevice" "none"
EndSection

Section "Screen"
    Identifier "RDFScreen"
    Device "RDFNvidia"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Virtual 1280 800
    EndSubSection
EndSection

Section "Module"
    Load "glx"
EndSection
