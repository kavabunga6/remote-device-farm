map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  listen 443 ssl;
  server_name _;
  ssl_certificate /etc/nginx/tls/ip.crt;
  ssl_certificate_key /etc/nginx/tls/ip.key;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # The UI is a single bundled app: no third-party scripts, styles or fonts. Inline styles come from React style props.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' wss://$http_host; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Strict-Transport-Security "max-age=86400" always;

  location /api/ {
    proxy_pass http://server:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_buffering off;
    client_max_body_size 512m;
  }

  location /agent/ {
    proxy_pass http://server:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_buffering off;
  }

  # Built-in registry of farm emulator images. The server checks every request (registry tokens, see server/src/registry.ts).
  location /v2/ {
    auth_request /_registry_auth;
    # Resolved per request: installations without the registry service still start (and answer 502 here).
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $registry_upstream http://registry:5000;
    proxy_pass $registry_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    client_max_body_size 0;
    chunked_transfer_encoding on;
    error_page 401 = @registry_unauthorized;
  }
  location = /_registry_auth {
    internal;
    # Auth subrequests inherit the upload Content-Length even though no body is forwarded.
    client_max_body_size 0;
    proxy_pass http://server:8080/api/registry/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-URI $request_uri;
  }
  location @registry_unauthorized {
    add_header WWW-Authenticate 'Basic realm="Remote Device Farm registry"' always;
    add_header Docker-Distribution-Api-Version registry/2.0 always;
    return 401;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
