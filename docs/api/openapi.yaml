openapi: 3.0.3
info:
  title: Remote Device Farm API
  version: 1.0.0
  description: REST API used by the web interface and automation clients. Browser sessions use an HTTP-only
    cookie; automation uses personal or system bearer tokens. Permissions, ownership, resource limits and node
    policy are enforced by the same routes. WebSocket transports are described in the API guide.
servers:
  - url: https://farm.example.com
    description: Replace with your PUBLIC_URL
security:
  - bearerAuth: []
  - cookieAuth: []
tags:
  - name: Sessions
  - name: Queue
  - name: ADB
  - name: Diagnostics
  - name: Tokens
  - name: Users
  - name: Roles
  - name: Emulator images
  - name: Registry
  - name: Administration
  - name: Account
  - name: Service
paths:
  /api/me:
    get:
      tags: [ Users ]
      summary: Current user and effective permissions
      description: Personal tokens and browser sessions resolve the current assigned role on every request.
      responses:
        "200":
          description: Current identity, or null when signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getMeResponse"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: getMe
      security: []
  /api/admin/roles:
    get:
      tags: [ Roles ]
      summary: List roles and the permission catalogue
      description: Requires roles.view. Built-in administrator always grants every known permission.
      responses:
        "200":
          description: Roles with active user counts and grouped available actions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAdminRolesResponse"
        "403":
          description: roles.view required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: getAdminRoles
      x-permission: roles.view
    post:
      tags: [ Roles ]
      summary: Create an access role
      description: Requires roles.manage. Permission IDs and their prerequisites must match the catalogue. Names are
        unique ignoring case.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessRoleInput"
      responses:
        "201":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  role:
                    $ref: "#/components/schemas/RoleRecord"
                required: [ role ]
        "400":
          description: Invalid name, unknown permissions or missing prerequisites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: roles.manage required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: postAdminRoles
      x-permission: roles.manage
  /api/admin/roles/{id}:
    patch:
      tags: [ Roles ]
      summary: Change a role name and permissions
      description: >
        Requires roles.manage. The built-in administrator is immutable; both built-in role names are fixed.
        Permission changes

        revoke affected screen/ADB connections and temporary ADB leases, cancel waiting launch

        requests, and apply to existing personal API tokens. Running devices remain allocated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessRoleInput"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  role:
                    $ref: "#/components/schemas/RoleRecord"
                required: [ role ]
        "400":
          description: Invalid role definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: roles.manage required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Role not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Protected role or duplicate name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: patchAdminRolesById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      x-permission: roles.manage
    delete:
      tags: [ Roles ]
      summary: Delete an unused custom role
      description: Requires roles.manage. Reassign active users first; built-in roles cannot be deleted.
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ ok ]
        "403":
          description: roles.manage required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Role not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Protected role or role still assigned to users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: deleteAdminRolesById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      x-permission: roles.manage
  /api/admin/users/{id}/role:
    put:
      tags: [ Roles, Users ]
      summary: Assign a role to a user
      description: |
        Requires roles.manage. Works for local, LDAP and OIDC accounts. A later external
        login preserves the assignment. System accounts cannot be reassigned; the last
        active human administrator cannot be demoted. Effective grants change immediately.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ roleId ]
              properties:
                roleId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ ok ]
        "400":
          description: Invalid identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: roles.manage required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User or role not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Would demote the last human administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: putAdminUsersByIdRole
      x-permission: roles.manage
  /api/admin/users:
    get:
      tags: [ Users ]
      summary: List users and assigned roles
      description: Requires users.view; includes roleId, roleName, roleBuiltin and registration date.
      responses:
        "200":
          description: Active accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAdminUsersResponse"
        "403":
          description: users.view required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: getAdminUsers
      x-permission: users.view
    post:
      tags: [ Users ]
      summary: Create a local user with an assigned role
      description: |
        Requires users.manage. roleId defaults to the built-in user. Assigning another role
        requires roles.manage. Without roles.manage the selected role cannot grant more
        permissions than the actor has. Legacy role=admin/user remains accepted.
        A deleted local login can be reused. The new account receives a new ID and does not
        inherit the deleted account's access, settings or history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ username, password ]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 150
                password:
                  type: string
                  minLength: 12
                  maxLength: 2048
                  writeOnly: true
                displayName:
                  type: string
                roleId:
                  type: string
                  format: uuid
                role:
                  type: string
                  enum: [ admin, user ]
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/postAdminUsersResponse"
        "400":
          description: Invalid user or role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Missing permission or would grant stronger access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Username already exists or local accounts disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: postAdminUsers
      x-permission: users.manage
  /api/navigation-counts:
    get:
      summary: Sidebar totals scoped to the signed-in user
      description: |
        sessions counts the user's starting, running and stopping sessions without a list size limit.
        tokens counts their personal tokens, including expired ones shown on the token page;
        administrators also see system tokens in this total. Administrator-only fields are allSessions,
        nodes (including offline/disabled, excluding removed), profiles (including disabled, excluding
        removed and internal device profiles), and users (excluding the internal system identity).
      responses:
        "200":
          description: Scalar totals; administrator fields are omitted for ordinary users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getNavigationcountsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: getNavigationcounts
      tags: [ Service ]
  /api/admin/session-diagnostics:
    get:
      tags: [ Administration ]
      summary: Incremental chronological log of one session (admin only)
      description: The log is retained after cleanup. Follow nextCursor with after while hasMore is true, then poll
        for new records.
      parameters:
        - in: query
          name: session
          required: true
          schema:
            type: string
          description: Session UUID or eight-character prefix
        - in: query
          name: after
          schema:
            type: string
          description: Exclusive record ID cursor
        - in: query
          name: limit
          schema:
            type: integer
            default: 500
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Oldest records first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAdminSessiondiagnosticsResponse"
        "400":
          description: Invalid session or cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Required permission missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: getAdminSessiondiagnostics
      x-permission: logs.view
  /api/admin/logs:
    get:
      tags: [ Administration ]
      summary: Persisted service and session lifecycle diagnostics (admin only)
      description: Logs survive session deletion. Messages are redacted. Session accepts a full UUID or its first
        eight hex characters.
      parameters:
        - in: query
          name: session
          schema:
            type: string
          description: Session UUID or eight-character prefix
        - in: query
          name: host
          schema:
            type: string
        - in: query
          name: severity
          schema:
            type: string
            enum: [ info, warning, error ]
        - in: query
          name: service
          schema:
            type: string
            enum: [ server, agent, emulator ]
        - in: query
          name: before
          schema:
            type: string
          description: Exclusive record ID cursor
        - in: query
          name: limit
          schema:
            type: integer
            default: 25
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Newest records first, with nextCursor for older records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAdminLogsResponse"
        "400":
          description: Invalid filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Required permission missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: getAdminLogs
      x-permission: logs.view
  /api/admin/application-log/stream:
    get:
      summary: Live application log (logs.view required)
      description: |
        Server console, service diagnostics (server/agent/emulator), node connections and useful API
        activity as an SSE text stream, ordered oldest to newest. Successful reads and keepalive
        polling are omitted unless slow; failures and mutations include method, route template,
        status and duration, without bodies, headers, query strings or private URL segments. Each
        entry includes source (server, agent or emulator). The in-memory tail
        keeps at most 2000 records, with up to 4096 characters per message, and clears on restart.
        Secret fields, credentials and configured secret values are redacted. Each entry has a cursor
        in its SSE id; send Last-Event-ID when reconnecting. A ready event reports reset/gap when a
        restart or retention prevents full replay. Browser access is revalidated every 15 seconds.
        Keepalive comments prevent proxy idle timeouts. At most 4 streams per user and 16 overall.
      parameters:
        - in: header
          name: Last-Event-ID
          schema:
            type: string
        - in: query
          name: after
          description: Initial resume cursor; Last-Event-ID takes precedence
          schema:
            type: string
      responses:
        "200":
          description: SSE events ready, entry and unauthorized
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                id: 44444444-4444-4444-8444-444444444444:1
                event: entry
                data: {"id":"44444444-4444-4444-8444-444444444444:1","occurredAt":"2026-10-07T10:20:30.000Z","level":"info","source":"server","message":"Remote Device Farm API listening on 8080"}
        "400":
          description: Invalid resume cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Required permission missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many application log streams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: getAdminApplicationlogStream
      tags: [ Administration ]
      x-permission: logs.view
  /api/admin/users/{id}:
    delete:
      tags: [ Users ]
      summary: Remove a user (users.delete required)
      description: |
        Hides the account and forbids future login, including recreation by LDAP or OIDC.
        Browser sessions, personal API tokens and ADB credentials are revoked; guest grants
        are revoked, pending queue requests are cancelled and webhooks are disabled.
        Audit and session history remain available. The current administrator, system identity
        and last human administrator cannot be removed. Finish active device sessions first.
        An administrator can explicitly create a new local account with the same login.
        LDAP and OIDC identities remain blocked after removal.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User removed; access revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/deleteSessionsByidSharesByshareIdResponse"
        "400":
          description: Invalid user ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Required permission missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found or already removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Own account, last administrator or active device sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: deleteAdminUsersById
      x-permission: users.delete
    patch:
      operationId: patchAdminUsersById
      tags: [ Administration ]
      summary: Update user details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/patchAdminUsersByidInput"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/postAdminUsersResponse"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-permission: users.manage
  /api/admin/users/{id}/password:
    post:
      tags: [ Users ]
      summary: Reset a local user's password (users.password required)
      description: |
        Only available in local authentication mode for local users. The new password is hashed;
        every existing browser login of the target user is revoked. Emulator sessions and API tokens
        are preserved. If the administrator resets their own password using a browser cookie,
        only the initiating browser receives a renewed login. The audit trail records the actor and
        target, never the password. LDAP and OIDC passwords must be changed at their identity provider.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ newPassword ]
              properties:
                newPassword:
                  type: string
                  format: password
                  writeOnly: true
                  minLength: 12
                  maxLength: 2048
      responses:
        "200":
          description: Password reset; target browser logins revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/deleteSessionsByidSharesByshareIdResponse"
        "400":
          description: Invalid user ID or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Required permission missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Password managed by an external identity provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: postAdminUsersByIdPassword
      x-permission: users.password
  /api/admin/registry:
    get:
      tags: [ Registry ]
      summary: Read registry settings (administrator only)
      responses:
        "200":
          description: Addresses and username; password is never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAdminRegistryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: getAdminRegistry
      x-permission: images.view
    put:
      tags: [ Registry ]
      summary: Partially update registry settings (administrator only)
      description: Addresses contain host[:port], without scheme. An external address may include a repository
        prefix. Changing the registry does not copy existing images.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum: [ builtin, external ]
                builtinAddress:
                  type: string
                  nullable: true
                  example: farm.example.com:8443
                externalAddress:
                  type: string
                  nullable: true
                  example: registry.example.com/team
                externalUsername:
                  type: string
                  nullable: true
                  maxLength: 200
                externalPassword:
                  type: string
                  nullable: true
                  maxLength: 1000
                  writeOnly: true
                  description: Omit or null to retain; empty string clears.
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAdminRegistryResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: putAdminRegistry
      x-permission: images.settings
  /api/admin/hosts/{id}/image-builder:
    put:
      tags: [ Emulator images ]
      summary: Select or unselect the image builder (administrator only)
      description: Enabling this node unselects the previous builder. Only one builder may be selected.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ enabled ]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: Selection saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/deleteSessionsByidSharesByshareIdResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: putAdminHostsByIdImagebuilder
      x-permission: images.settings
  /api/admin/emulator-images:
    get:
      tags: [ Emulator images ]
      summary: Read the SDK catalog, builds and linked profiles (administrator only)
      description: The initial SDK tools preparation may take several minutes. Completed builds are reconciled by
        the server in the background, even when this endpoint is not polled.
      parameters:
        - name: refresh
          in: query
          schema:
            type: string
            enum: [ "1" ]
          description: Refresh sdkmanager catalog instead of reusing the cache.
      responses:
        "200":
          description: Catalog; empty images and jobs if no builder is selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAdminEmulatorimagesResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: getAdminEmulatorimages
      x-permission: images.view
  /api/admin/emulator-images/builds:
    post:
      tags: [ Emulator images ]
      summary: Queue image builds and pushes (administrator only)
      description: Packages must exist in the selected builder catalog. New profiles appear only after successful
        push and digest registration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ packages ]
              properties:
                packages:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: string
                    maxLength: 120
                  example: [ system-images;android-34;google_apis;x86_64 ]
      responses:
        "202":
          description: Build queue accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/postAdminEmulatorimagesBuildsResponse"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: No available builder or registry not configured; error codes no_image_builder or
            registry_not_configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: postAdminEmulatorimagesBuilds
      x-permission: images.build
  /api/admin/emulator-images/builds/{jobId}/cancel:
    post:
      tags: [ Emulator images ]
      summary: Cancel one image build on its original node (administrator only)
      description: Queued jobs become cancelled immediately; running builds/pushes become cancelling until the agent
        confirms termination. Repeating a terminal cancellation returns its current state, including done if
        completion won the race. The request never switches to a newly selected builder.
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
            pattern: ^[A-Za-z0-9-]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ builderHostId ]
              properties:
                builderHostId:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Builder ID captured together with this job in the catalog response.
      responses:
        "200":
          description: Current state of the requested job; cancellation may still be in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/postAdminEmulatorimagesBuildsResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Node removed/unknown (not_found), or job absent on that node (image_build_not_found).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Node disconnected; error code agent_offline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Agent did not confirm cancellation or returned an invalid result; error code
            image_build_cancel_failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: Agent command timed out; refresh job state before retrying. Error code agent_timeout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: postAdminEmulatorimagesBuildsByJobIdCancel
      x-permission: images.build
  /api/admin/emulator-images/prewarm:
    get:
