    EmulatorSessionInput:
      type: object
      required: [ hostId ]
      properties:
        hostId:
          type: string
          example: node-1
        profileId:
          type: string
          example: android-30
          description: Emulator profile; takes precedence over profile. Required unless profile or deviceKind is set.
        profile:
          $ref: "#/components/schemas/ProfileSelector"
        gpuMode:
          type: string
          enum: [ software, nvidia ]
          description: Emulator graphics mode supported by the profile and host.
        diskGb:
          type: integer
          minimum: 2
          maximum: 128
          description: Internal data size in GiB within profile diskMaxGb (or diskGb when no maximum). Must equal
            launchOptions.diskGb if both are supplied.
        sdcardGb:
          type: integer
          minimum: 0
          maximum: 32
          description: SD size in whole GiB within the profile maximum; 0 disables it. Must match launchOptions.sdCardMb
            after conversion if both are supplied.
        launchOptions:
          $ref: "#/components/schemas/LaunchOptions"
        adbKeyId:
          type: string
          format: uuid
          nullable: true
          description: Public key owned by the caller. Omission uses their account default; null selects their personal
            farm key if present.
        leaseTtlSeconds:
          type: integer
          minimum: 30
          maximum: 3600
          description: Opt-in renewable lease for automation. Omit for the normal interactive lifecycle.
        deviceKind:
          type: string
          enum: [ usb-android ]
          description: Rent a physical device instead of starting an emulator.
        deviceId:
          type: string
          example: R58M123ABC
          description: Serial/UDID from `devices` of GET /api/hosts. Required with `deviceKind`; the device must be
            `free`.
        label:
          type: string
          maxLength: 60
          example: "ci #1423 main"
      anyOf:
        - required: [ profileId ]
        - required: [ profile ]
      not:
        required: [ deviceKind ]
    PhysicalSessionInput:
      type: object
      required: [ hostId, deviceKind, deviceId ]
      properties:
        hostId:
          type: string
          maxLength: 100
        deviceKind:
          type: string
          enum: [ usb-android ]
        deviceId:
          type: string
          maxLength: 100
        label:
          type: string
          maxLength: 60
        leaseTtlSeconds:
          type: integer
          minimum: 30
          maximum: 3600
  responses:
    Forbidden:
      description: Required permission missing
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: invalid_request
              message: hostId and profileId are required
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unauthorized
              message: Login required
    NotFound:
      description: Not found, or the session belongs to another user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: not_found
              message: Session not found
