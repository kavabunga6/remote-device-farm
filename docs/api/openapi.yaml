components:
  securitySchemes:
    registryBasic:
      type: http
      scheme: basic
      description: Short-lived registry-only credentials issued to agents; separate from user API tokens.
    bearerAuth:
      type: http
      scheme: bearer
      description: Personal API token (`rdf_...`)
    cookieAuth:
      type: apiKey
      in: cookie
      name: rdf_session
      description: HTTP-only session cookie issued by POST /api/login.
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ImageCleanupRequest:
      type: object
      required: [ scope, action ]
      properties:
        scope:
          type: string
          enum: [ registry, cache ]
        action:
          type: string
          enum: [ delete, retention, gc ]
        hostId:
          type: string
          maxLength: 200
        digests:
          type: array
          items:
            type: string
            pattern: ^sha256:[a-f0-9]{64}$
          maxItems: 500
          uniqueItems: true
        ids:
          type: array
          items:
            type: string
            pattern: ^sha256:[a-f0-9]{64}$
          maxItems: 100
          uniqueItems: true
        removeProfiles:
          type: boolean
          default: false
          description: "Explicit registry deletion only: soft-delete linked profiles instead of disabling them."
        token:
          type: string
          description: Required when queueing; obtain it from the current preview.
      additionalProperties: false
      description: Registry delete requires digests; cache delete requires hostId and ids. Retention applies the
        saved policy; gc collects physical storage without deleting additional manifests. Any change in
        references invalidates the confirmation token.
    ImageCleanupPolicy:
      type: object
      required: [ registryEnabled, registryKeep, registryDays, cacheEnabled, cacheDays, cacheMaxGb, intervalHours ]
      properties:
        registryEnabled:
          type: boolean
          default: false
        registryKeep:
          type: integer
          minimum: 1
          maximum: 100
          default: 3
        registryDays:
          type: integer
          minimum: 1
          maximum: 3650
          default: 30
        cacheEnabled:
          type: boolean
          default: false
        cacheDays:
          type: integer
          minimum: 1
          maximum: 3650
          default: 30
        cacheMaxGb:
          type: integer
          minimum: 0
          maximum: 100000
          default: 0
          description: 0 means unlimited; protected images can exceed this target.
        intervalHours:
          type: integer
          minimum: 1
          maximum: 720
          default: 24
        lastRunAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
      additionalProperties: false
    AccessUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        provider:
          type: string
        role:
          type: string
          enum: [ admin, user ]
          description: Legacy administrator and limit marker; custom roles use user.
        roleId:
          type: string
          format: uuid
        roleName:
          type: string
        roleBuiltin:
          type: string
          enum: [ admin, user ]
          nullable: true
        permissions:
          type: array
          items:
            type: string
          description: Effective permissions; returned by /api/me, not by the user directory.
        createdAt:
          type: string
          format: date-time
    AccessRoleInput:
      type: object
      required: [ name, permissions ]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
          example: [ sessions.view, nodes.view ]
    ProfileSelector:
      type: object
      additionalProperties: false
      description: Select an enabled allowed profile by properties. All fields are optional. Recommended profiles
        rank first, then newest API, then name. No match returns 404 no_matching_profile. Selection does not
        build an image or guarantee a free compatible node. If profileId is present, it takes precedence.
      properties:
        android:
          type: string
          pattern: ^[0-9]{1,2}(\.[0-9]{1,2})?L?$
          example: "14"
        api:
          type: integer
          minimum: 1
          maximum: 99
          example: 34
        deviceType:
          type: string
          enum: [ mobile, tv, wear, automotive, desktop ]
        form:
          type: string
          enum: [ phone, tablet ]
        flavor:
          type: string
          enum: [ aosp, google_apis, google_play ]
        abi:
          type: string
          pattern: ^[a-z0-9_-]{2,20}$
          example: x86_64
      example:
        api: 34
        form: tablet
        flavor: google_apis
    LaunchSettings:
      type: object
      additionalProperties: false
      required: [ allowLaunchOverrides ]
      properties:
        allowLaunchOverrides:
          type: boolean
          default: false
    LaunchOptions:
      type: object
      additionalProperties: false
      description: Per-session overrides. Requires profile or global launch permission; effective values remain
        bounded by profile and node policy.
      properties:
        privileged:
          type: boolean
          description: Agent support for this mode is not yet implemented; the API field alone does not enable it. A
            future request for true requires an administrator and an agent explicitly configured with
            AGENT_ALLOW_PRIVILEGED_EMULATORS=1. Omitted or false keeps normal isolation. Unsupported on USB
            devices.
        diskGb:
          type: integer
          minimum: 2
          maximum: 128
          description: Android internal userdata partition in GiB, passed as -partition-size. Bounded by the profile
            maximum. This is not a Docker or host filesystem quota.
        sdCardMb:
          type: integer
          oneOf:
            - enum: [ 0 ]
            - minimum: 128
              maximum: 32768
          description: Virtual SD card in MiB; 0 disables it. Omit to inherit the profile default. Must not exceed
            sdcardMaxGb converted to MiB, or sdcardGb when the maximum is unset; both unset means no card.
        emulatorParams:
          type: string
          maxLength: 500
          description: Replace profile extra emulator arguments. Empty string clears them; omission inherits. Only the
            supported argument allowlist is accepted, without shell syntax or Docker flags.
        cpu:
          type: integer
          minimum: 1
          maximum: 16
        memoryMb:
          type: integer
          minimum: 1024
          maximum: 65536
        guestCores:
          type: integer
          minimum: 1
          maximum: 16
          nullable: true
        guestMemoryMb:
          type: integer
          minimum: 1024
          maximum: 64512
          nullable: true
      example:
        diskGb: 16
        sdCardMb: 1024
        emulatorParams: -no-snapshot -no-boot-anim -change-language ru -change-country RU
