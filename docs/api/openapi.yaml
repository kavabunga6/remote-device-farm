                $ref: "#/components/schemas/getHostsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: getHosts
  /api/admin/launch-settings:
    get:
      tags: [ Administration ]
      summary: Read the farm default permission for user launch overrides
      responses:
        "200":
          description: Farm default; disabled on a fresh installation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAdminLaunchsettingsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Required permission missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: getAdminLaunchsettings
      x-permission: profiles.view
    patch:
      tags: [ Administration ]
      summary: Set the farm default permission for user launch overrides
      description: Individual profiles override this default with allowLaunchOverrides (null inherits, true allows,
        false denies). Administrators may always configure launches. GPU and ADB selection are independent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LaunchSettings"
      responses:
        "200":
          description: Saved permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAdminLaunchsettingsResponse"
        "400":
          description: Invalid permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Required permission missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: patchAdminLaunchsettings
      x-permission: profiles.manage
  /api/profiles:
    get:
      tags: [ Sessions ]
      summary: List enabled device profiles
      description: Filter by the same fields accepted by the profile selector; only profiles allowed to the current
        user are returned. Each profile includes allowLaunchOverrides (nullable per-profile override) and
        launchOverridesAllowed (resolved farm/profile permission).
      parameters:
        - name: android
          in: query
          schema:
            type: string
            example: "14"
        - name: api
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 99
        - name: deviceType
          in: query
          schema:
            type: string
            enum: [ mobile, tv, wear, automotive, desktop ]
        - name: form
          in: query
          schema:
            type: string
            enum: [ phone, tablet ]
        - name: flavor
          in: query
          schema:
            type: string
            enum: [ aosp, google_apis, google_play ]
        - name: abi
          in: query
          schema:
            type: string
            example: x86_64
      responses:
        "200":
          description: Profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getProfilesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: getProfiles
  /api/queue:
    get:
      tags: [ Queue ]
      summary: List your waiting requests and positions
      responses:
        "200":
          description: Waiting entries only; poll an individual request to follow its assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getQueueResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: getQueue
    post:
      tags: [ Queue ]
      summary: Request a slot and let the server choose a compatible host
      description: >
        Omit hostId to use any compatible host. The chosen ADB key, GPU mode and launchOptions are retained
        while waiting.

        launchOptions override storage and supported emulator arguments for this session; they do not edit the
        profile.

        Send a fresh Idempotency-Key for each new job. Retrying with the same key and parameters returns

        the same request, even after assignment, cancellation or expiry. Reusing the key with changed
        parameters returns 409.

        Poll GET /api/queue/{id}; an assigned request contains the sessionId to use for session APIs.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9._:-]+$
          description: Unique within the token owner's account; reuse only to retry the same request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              anyOf:
                - required: [ profileId ]
                - required: [ profile ]
              properties:
                profileId:
                  type: string
                  example: android-30
                  description: Takes precedence when both profileId and profile are supplied.
                profile:
                  $ref: "#/components/schemas/ProfileSelector"
                hostId:
                  type: string
                  nullable: true
                  description: Omit or null for automatic host selection.
                gpuMode:
                  type: string
                  enum: [ software, nvidia ]
                diskGb:
                  type: integer
                  minimum: 2
                  maximum: 128
                  description: Internal data size in GiB within profile diskMaxGb (or diskGb when no maximum). Must equal
                    launchOptions.diskGb if both are supplied.
                sdcardGb:
                  type: integer
                  minimum: 0
                  maximum: 32
                  description: SD size in whole GiB within the profile maximum; 0 disables it. Must match launchOptions.sdCardMb
                    after conversion if both are supplied.
                launchOptions:
                  $ref: "#/components/schemas/LaunchOptions"
                adbKeyId:
                  type: string
                  format: uuid
                  nullable: true
                  description: An uploaded key owned by the caller. Omit to capture the current default; null selects the
                    personal farm key if one exists.
                leaseTtlSeconds:
                  type: integer
                  minimum: 30
                  maximum: 3600
                  description: Optional CI lease, starting when the session is assigned. Renew through the session keepalive
                    API.
                label:
                  type: string
                  maxLength: 60
      responses:
        "200":
          description: Existing request returned for an idempotent retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/postQueueResponse"
        "201":
          description: Request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/postQueueResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: queue_full, idempotency_conflict, unsupported profile/image or incompatible selected host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: postQueue
      x-permission: sessions.create
  /api/queue/{id}:
    get:
      tags: [ Queue ]
      summary: Read your request through its entire lifecycle
      description: >
        Unlike GET /api/queue this endpoint retains assigned and terminal requests.

        `assigning` already includes the future sessionId, but that session can still return 404 until
        creation commits.

        `assigned` means creation committed; sessionState `released` means the session has since been removed.
      responses:
        "200":
          description: Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: getQueueById
      parameters:
        - $ref: "#/components/parameters/SessionId"
    delete:
      tags: [ Queue ]
      summary: Cancel a waiting request
      description: >
        Repeated cancellation is safe. If assignment won the race, 409 returns the current entry with
        sessionId.

        Follow GET /api/queue/{id} until assignment resolves, then release the session and wait for confirmed
        cleanup.

        Never treat a session 404 during `assigning` as successful release.
      responses:
        "200":
          description: Cancelled or already terminal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueEntry"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Assignment has started; release its session instead
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      entry:
                        $ref: "#/components/schemas/QueueEntry"
              example:
                error:
                  code: queue_already_assigned
                  message: Assignment has started; release the session identified by this queue entry
                entry:
                  id: 6f1d2c5e-8a47-4b6e-9e0a-0f4f4a8a1d11
                  state: assigning
                  sessionId: 6f1d2c5e-8a47-4b6e-9e0a-0f4f4a8a1d11
                  sessionState: null
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: deleteQueueById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /api/sessions:
    get:
      tags: [ Sessions ]
      summary: List your sessions
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getSessionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: getSessions
      x-permission: sessions.view
    post:
      tags: [ Sessions ]
      summary: Start a device session
      description: |
        Returns 202 with state `starting`. Poll `GET /api/sessions/{id}` until the state is `running`.
        If startup fails the session is removed and the poll returns 404.
        Setting a label (up to 60 characters) such as the pipeline URL helps people recognise the session.
        CI clients should normally use POST /api/queue with Idempotency-Key for recoverable allocation.
        Optional leaseTtlSeconds starts immediately when the session is reserved, including startup.
        Renew it through keepalive before expiry; normal input and open ADB connections do not renew it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/EmulatorSessionInput"
                - $ref: "#/components/schemas/PhysicalSessionInput"
      responses:
        "202":
          description: Session accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getSessionsByidResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Limit reached or no free slots (`session_limit`, `no_free_slots`)
          content:
            application/json:
              example:
                error:
                  code: no_free_slots
                  message: No free slots on this host
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Host agent offline (`agent_offline`)
          content:
            application/json:
              example:
                error:
                  code: agent_offline
                  message: Host agent is offline
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: postSessions
      x-permission: sessions.create
  /api/sessions/{id}:
    get:
      tags: [ Sessions ]
      summary: Read one session
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getSessionsByidResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: getSessionsById
      parameters:
        - $ref: "#/components/parameters/SessionId"
      x-permission: sessions.view
    patch:
      tags: [ Sessions ]
      summary: Set or clear the label
      requestBody:
        required: true
        content:
          application/json:
            example:
              label: "ci #1424"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getSessionsByidResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: patchSessionsById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      x-permission: sessions.control
    delete:
      tags: [ Sessions ]
      summary: Release the device session
      description: >
        200 confirms device cleanup. 202 means shutdown is still in progress and the slot remains reserved.

        Poll GET /api/sessions/{id} until 404 before discarding recovery state.

        A second DELETE after confirmed release returns 404. A 502 stop_pending means agent cleanup was not
        confirmed.
      responses:
        "200":
          description: Already released.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  id:
                    type: string
                  released:
                    type: boolean
                  accepted:
                    type: boolean
                required: [ ok, id, released ]
        "202":
          description: Stopping; cleanup is pending.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  id:
                    type: string
                  released:
                    type: boolean
                  accepted:
                    type: boolean
                required: [ ok, id, released ]
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: stop_pending; slot stays reserved until the agent confirms cleanup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: deleteSessionsById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      x-permission: sessions.stop
  /api/sessions/{id}/keepalive:
    post:
      tags: [ Sessions ]
      summary: Renew the client lease and reset activity (owner only)
      description: >
        For a leased session, extend leaseExpiresAt by its original leaseTtlSeconds from the current server
        time.

        With a 120-second lease, send a heartbeat every 30 seconds, including while starting.

        Expired leases cannot be revived (409 session_lease_expired). Stopping sessions cannot be renewed.

        Sessions without an explicit lease only update their last activity time.
      responses:
        "200":
          description: Session with the new deadlines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getSessionsByidResponse"
        "403":
          description: Only the owner can renew, including for administrators
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: session_lease_expired or session_inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: postSessionsByIdKeepalive
      parameters:
        - $ref: "#/components/parameters/SessionId"
      x-permission: sessions.view
  /api/sessions/{id}/adb-port-access:
    get:
      tags: [ ADB ]
      summary: Current ADB lease
      responses:
        "200":
          description: Lease or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getSessionsByidAdbportaccessResponse"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: getSessionsByIdAdbportaccess
      parameters:
        - $ref: "#/components/parameters/SessionId"
      x-permission: sessions.adb
    post:
      tags: [ ADB ]
      summary: Open the TCP port for `adb connect`
      description: |
        With `{}` the broker uses the caller's saved ADB key (create one once with `POST /api/me/adb-key`
        and store `adbkey` and `adbkey.pub` in `~/.android`). In CI put the private key in a secret.
        Alternatively send `{publicKey}` with an `adbkey.pub` to get a one-hour lease.
        The session must be `running`.
      requestBody:
        required: false
        content:
          application/json:
            examples:
              saved-key:
                value: {}
              own-key:
                value:
                  publicKey: QAAAA... user@host
      responses:
        "201":
          description: Lease created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getSessionsByidAdbportaccessResponseAccess1"
        "409":
          description: "`session_not_ready` or `adb_key_missing`"
          content:
            application/json:
              example:
                error:
                  code: adb_key_missing
                  message: Create an ADB key or provide adbkey.pub
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "`adb_port_disabled`, the broker has no ADB range configured"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: postSessionsByIdAdbportaccess
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      x-permission: sessions.adb
    delete:
      tags: [ ADB ]
      summary: Revoke the lease
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/deleteMeAdbpublickeysByidResponse"
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: deleteSessionsByIdAdbportaccess
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      x-permission: sessions.adb
