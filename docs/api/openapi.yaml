          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: postAdminEmulatorimagesApply
      x-permission: images.build
  /api/registry/auth:
    get:
      tags: [ Registry ]
      summary: Internal nginx auth_request hook for the built-in registry
      description: Called by nginx for every /v2/ request. A short-lived registry credential is required; user API
        tokens do not authenticate this endpoint. Pull credentials permit GET/HEAD only; push credentials
        permit writes.
      security:
        - registryBasic: []
      parameters:
        - name: X-Original-Method
          in: header
          schema:
            type: string
            default: GET
      responses:
        "200":
          description: Registry operation authorized
        "401":
          description: Registry credential missing or expired
          headers:
            WWW-Authenticate:
              schema:
                type: string
        "403":
          description: Pull-only credential cannot write
        default:
          description: Request rejected. The error code is stable; the message is intended for display.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      operationId: getRegistryAuth
  /v2/:
    get:
      tags: [ Registry ]
      summary: Docker Distribution API v2 probe
      description: nginx proxies the Docker Distribution API under /v2/ with the same authentication for manifests
        and blobs. This specification describes the probe; other /v2/ operations follow the Distribution API,
        not the farm JSON API.
      security:
        - registryBasic: []
      responses:
        "200":
          description: Registry reachable and credential authorized
        "401":
          description: Registry requires a short-lived farm credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-external: true
  /api/hosts:
    get:
      tags: [ Sessions ]
      summary: List hosts and their free capacity
      responses:
        "200":
          description: Hosts
          content:
            application/json:
