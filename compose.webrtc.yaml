# Optional overlay: use together with your normal agent/homelab compose file.
# Direct connections expose node addresses to viewers. Explicitly set
# AGENT_ALLOW_DIRECT_CONNECTIONS=1 and AGENT_WEBRTC_HOST_IP to opt in.
services:
  agent:
    environment:
      AGENT_ALLOW_DIRECT_CONNECTIONS: ${AGENT_ALLOW_DIRECT_CONNECTIONS:-0}
      AGENT_WEBRTC_ENABLED: "1"
      AGENT_WEBRTC_HOST_IP: ${AGENT_WEBRTC_HOST_IP:?Set the reachable node IP}
      AGENT_WEBRTC_PORT_MIN: ${AGENT_WEBRTC_PORT_MIN:-50000}
      AGENT_WEBRTC_PORT_MAX: ${AGENT_WEBRTC_PORT_MAX:-50100}
      AGENT_WEBRTC_ICE_SERVERS: ${AGENT_WEBRTC_ICE_SERVERS:-[]}
    ports:
      - "${AGENT_WEBRTC_HOST_IP}:${AGENT_WEBRTC_PORT_MIN:-50000}-${AGENT_WEBRTC_PORT_MAX:-50100}:${AGENT_WEBRTC_PORT_MIN:-50000}-${AGENT_WEBRTC_PORT_MAX:-50100}/udp"
